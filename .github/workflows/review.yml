name: Otter Reviewer

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array passed to runs-on, for example ["self-hosted","otter-reviewer"].
        required: false
        type: string
        default: '["self-hosted","otter-reviewer"]'
      max-inline-comments:
        description: Maximum number of inline comments to post.
        required: false
        type: string
        default: "10"
      post-empty-review:
        description: Post a visible review when no inline comments are produced.
        required: false
        type: string
        default: "true"
      dry-run:
        description: Print the review payload instead of posting it.
        required: false
        type: string
        default: "false"
      codex-home:
        description: CODEX_HOME directory containing config.toml.
        required: false
        type: string
        default: ""
      codex-profile:
        description: Optional Codex config profile.
        required: false
        type: string
        default: ""
      codex-model:
        description: Optional Codex model override.
        required: false
        type: string
        default: ""
      review-instructions:
        description: Optional extra review instructions.
        required: false
        type: string
        default: ""
      agent-command:
        description: Optional custom review agent executable. When empty, Codex is used.
        required: false
        type: string
        default: ""
      agent-args-json:
        description: JSON array of custom agent arguments.
        required: false
        type: string
        default: "[]"
      agent-env-pass:
        description: Comma-separated environment variables to pass to the custom agent.
        required: false
        type: string
        default: ""
      agent-timeout-seconds:
        description: Maximum seconds to wait for the agent CLI.
        required: false
        type: string
        default: "900"
      max-diff-bytes:
        description: Maximum PR diff bytes to send to the agent.
        required: false
        type: string
        default: "250000"
      allow-fork-prs:
        description: Allow reviewing fork pull requests. Use only with isolated runners and no sensitive agent credentials.
        required: false
        type: string
        default: "false"
      review-drafts:
        description: Review draft pull requests.
        required: false
        type: string
        default: "false"
      pr_number:
        description: Optional pull request number for workflow_dispatch callers.
        required: false
        type: string
        default: ""
    secrets:
      OTTER_REVIEWER_APP_ID:
        required: true
      OTTER_REVIEWER_PRIVATE_KEY:
        required: true
      OTTER_REVIEWER_INSTALLATION_ID:
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: otter-reviewer-${{ inputs.pr_number || github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: Otter Reviewer
    if: (inputs['allow-fork-prs'] == 'true' || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (inputs['review-drafts'] == 'true' || github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ${{ fromJSON(inputs['runs-on']) }}
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Show local tool versions
        shell: bash
        env:
          OTTER_AGENT_COMMAND: ${{ inputs['agent-command'] }}
          OTTER_CODEX_HOME: ${{ inputs['codex-home'] }}
        run: |
          git --version
          node --version
          if [[ -z "${OTTER_AGENT_COMMAND}" ]]; then
            codex --version
            test -f "${OTTER_CODEX_HOME:-${CODEX_HOME:-$HOME/.codex}}/config.toml"
          else
            command -v "${OTTER_AGENT_COMMAND}"
          fi

      - name: Run Otter Reviewer
        uses: zz-jason/otter-reviewer-action@v1
        with:
          app-id: ${{ secrets.OTTER_REVIEWER_APP_ID }}
          private-key: ${{ secrets.OTTER_REVIEWER_PRIVATE_KEY }}
          installation-id: ${{ secrets.OTTER_REVIEWER_INSTALLATION_ID }}
          max-inline-comments: ${{ inputs['max-inline-comments'] }}
          post-empty-review: ${{ inputs['post-empty-review'] }}
          dry-run: ${{ inputs['dry-run'] }}
          codex-home: ${{ inputs['codex-home'] }}
          codex-profile: ${{ inputs['codex-profile'] }}
          codex-model: ${{ inputs['codex-model'] }}
          review-instructions: ${{ inputs['review-instructions'] }}
          agent-command: ${{ inputs['agent-command'] }}
          agent-args-json: ${{ inputs['agent-args-json'] }}
          agent-env-pass: ${{ inputs['agent-env-pass'] }}
          agent-timeout-seconds: ${{ inputs['agent-timeout-seconds'] }}
          max-diff-bytes: ${{ inputs['max-diff-bytes'] }}
          allow-fork-prs: ${{ inputs['allow-fork-prs'] }}
          review-drafts: ${{ inputs['review-drafts'] }}
          pr-number: ${{ inputs.pr_number || github.event.pull_request.number || github.event.inputs.pr_number }}
