services:
  otter-runner:
    build:
      context: ..
      dockerfile: runner/Dockerfile
      args:
        CODEX_VERSION: ${CODEX_VERSION:-latest}
    environment:
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:?set target repository, for example zz-jason/otter-review-test}
      GITHUB_PAT: ${GITHUB_PAT:-}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: ${RUNNER_NAME:-otter-reviewer-docker}
      RUNNER_LABELS: ${RUNNER_LABELS:-otter-reviewer,docker}
      RUNNER_EPHEMERAL: ${RUNNER_EPHEMERAL:-true}
      REQUIRE_CODEX: ${REQUIRE_CODEX:-true}
      RUNNER_CACHE_DIR: /home/runner/.cache/otter-reviewer/actions-runner
      CODEX_HOME: /home/runner/.codex
    volumes:
      - ${CODEX_CONFIG:-${HOME}/.codex/config.toml}:/home/runner/.codex/config.toml:ro
      - ${RUNNER_CACHE_DIR:-${HOME}/.cache/otter-reviewer/actions-runner}:/home/runner/.cache/otter-reviewer/actions-runner
    tmpfs:
      - /home/runner/_work
